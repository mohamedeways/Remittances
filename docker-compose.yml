services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data            # database + receipt images (back this folder up)
    expose:
      - "8000"                  # NOT published: only Caddy can reach the app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates
      - caddy_config:/config
      # - ./certs:/certs:ro     # only if IT supplies its own certificate (see Caddyfile)

volumes:
  caddy_data:
  caddy_config:
